[project]
name = "hunter-w4"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lancedb>=0.33.0",
    "langchain>=1.3.10",
    "langgraph>=1.2.6",
    "lingua-language-detector>=2.2.0",
    "markdownify>=1.2.2",
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
trial          = "python -m src.runner --trial"
once           = "python -m src.runner --once"
schedule       = "python -m src.runner --interval 60"
check          = "python scripts/setup_check.py"
test           = "pytest tests/unit/ -q"
test-all       = "pytest --run-integration -q"
smoke          = "pytest tests/smoke/ -v -s"
login-linkedin = "python scripts/login_linkedin_persistent.py"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests que requieren servicios externos (Ollama, Telegram, Playwright). Activar con --run-integration",
]
